{% extends 'base.html' %}

{% block title %}Product{% endblock %}

{% block content %}
<h1>Barcha mahsulotlar</h1>
<div class="grid">
    {% for product in products %}
        <div class="card">
            <h3>{{ product.shop.name }}</h3>
            <p>Xaridor: {{ product.user.first_name }}</p>
            <p>Sana: {{ product.buy }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
