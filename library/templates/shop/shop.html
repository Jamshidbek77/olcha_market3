{% extends 'base.html' %}
{% block title %}
Shop
{% endblock %}
{% block content %}
<h1>Barcha do'konlar:</h1>
<ol>
    {% for shop in shops %}
        <li>
            <a href="{% url 'shop' shop.pk %}">
                {{ shop.name }}
            </a>
            {{ shop.address }}
        </li>
    {% endfor %}
</ol>
<form action="{% url 'create_shop' %}">
    <button>
        create
    </button>
</form>
{% endblock %}
